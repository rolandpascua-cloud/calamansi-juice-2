name: Prepare Debian Build
description: Extract version from git and create Debian packaging metadata from template

inputs:
  release:
    description: Ubuntu version (e.g., 24.04, 25.10, 26.04)
    required: true
  codename:
    description: Debian codename (e.g., noble, questing, resolute)
    required: true

outputs:
  version:
    description: Debian version (version without leading 'v')
    value: ${{ steps.get_version.outputs.version }}

runs:
  using: composite
  steps:
    - name: Get version from git describe
      id: get_version
      shell: bash
      run: |
        VERSION=$(git describe --tags --always)
        # Strip leading 'v' for Debian version compatibility
        DEB_VERSION=$(echo "${VERSION}" | sed 's/^v//')

        if ! [[ "$DEB_VERSION" =~ ^[0-9] ]]; then
          # No git tag reachable from HEAD: git describe fell back to a bare
          # commit hash, which dpkg-buildpackage rejects (Debian upstream
          # versions must start with a digit). Fall back to this fork's own
          # version scheme instead of requiring a tag to exist.
          BASE_VERSION=$(grep -oP 'project\(lemon_cpp VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          CJ_SUFFIX=$(grep -oP 'LEMON_FULL_VERSION_STRING "\$\{PROJECT_VERSION\}\K[^"]*' CMakeLists.txt)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DEB_VERSION="${BASE_VERSION}${CJ_SUFFIX}+git${SHORT_SHA}"
        fi

        echo "version=${DEB_VERSION}" >> $GITHUB_OUTPUT

    - name: Create Debian packaging metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -e
        mv contrib/debian .
        sed -e "s|@@DEB_VERSION@@|${{ steps.get_version.outputs.version }}~${{ inputs.release }}|g" \
            -e "s|@@DEB_CODENAME@@|${{ inputs.codename }}|g" \
            -e "s|@@DEB_DATE@@|$(date -R)|g" \
            debian/changelog.in > debian/changelog
